<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NOTES</title>

  <style>

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 40px;
  background-color: #4460AA;
  color: white;
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  text-align: center;
}

    .contenedor {
      width: 100%;
      max-width: 500px;
    }

  h2 {
  font-size: 32px;
  margin-top: 5px;
  margin-bottom: 20px;
}

    label {
      font-size: 20px;
    }

button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

  background: transparent;
  border: 1.5px solid white;
  color: #ffffff;
  transition: transform 0.5s ease, color 0.5s ease;
}

button:hover {
  transform: scale(1.2);
}

textarea {
  width: 100%;
  height: 200px;
  font-size: 16px;
  padding: 10px;
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

  background-color: white !important;
  color: black;
  border: none;
  border-radius: 5px;

  -webkit-appearance: none;
}

@keyframes spinY {
  from {
    transform: rotateY(0deg);
  }
  to {
    transform: rotateY(360deg);
  }
}

.spin-n {
  animation: spinY 12s linear infinite;
  display: inline-block;
  transform-style: preserve-3d;
}




.btn-enviado {
  color: #FFFF00 !important;
  border-color: #FFFF00 !important;
}







  </style>
</head>

<body>

  <div class="contenedor">


<div style="display:flex; justify-content:center;">
  
<div style="
  width:120px;
  height:120px;
  border:2px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin: 0 auto 20px auto;
">
  
  <div class="spin-n" style="
    color:white;
    font-size:87px;
    font-weight:bold;
  ">
    N
  </div>
 </div>
</div>


    <h2>Enviar Notas</h2>

    <form id="form">

      <textarea name="message" placeholder="Escribe tus notas..." required></textarea>

      <br><br>

      <div style="
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  font-size:20px;
">

  <label>
    <input type="checkbox" id="urgente">
    Urgente
  </label>

  <label>
    <input type="checkbox" id="hotel">
    Hotel
  </label>

  <label>
    <input type="checkbox" id="pelis">
    Pelis
  </label>

  <label>
    <input type="checkbox" id="bolsillo">
    Bolsillo
  </label>

  <label>
    <input type="checkbox" id="psico">
    Psico
  </label>

</div>

      <br><br>

      <button type="submit">Enviar</button>


</form>

</div>


<script>

const form = document.getElementById("form");
const textarea = form.querySelector("textarea");
const checkbox = document.getElementById("urgente");
const hotel = document.getElementById("hotel");
const pelis = document.getElementById("pelis");
const bolsillo = document.getElementById("bolsillo");
const psico = document.getElementById("psico");
const button = form.querySelector("button");
const originalButtonText = button.textContent;

let isSending = false;

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  if (isSending) return;
  isSending = true;

  button.disabled = true;
  button.textContent = "Enviando...";

  const message = textarea.value.trim();
  const now = new Date();

  const time =
    String(now.getDate()).padStart(2, "0") + "/" +
    String(now.getMonth() + 1).padStart(2, "0") + "/" +
    String(now.getFullYear()).slice(-2) + " " +
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

let etiquetas = [];

if (checkbox.checked) etiquetas.push("🚨 URGENTE");
if (hotel.checked) etiquetas.push("⭐ HOTEL");
if (pelis.checked) etiquetas.push("🎬 PELIS");
if (bolsillo.checked) etiquetas.push("💰 BOLSILLO");
if (psico.checked) etiquetas.push("🧠 PSICO");

const formattedMessage =
"📒 N O T E S\n" +
"🧑 Alejandro Pérez\n" +
"🕒 " + time + "\n" +
(etiquetas.length ? etiquetas.join(" · ") : "📝 MENSAJE") +
"\n\n" +
"───────────────────────────────────────────────────────────────────────────────────\n\n" +
message;

  let subjectIcons = [];

if (checkbox.checked) subjectIcons.push("🚨");
if (hotel.checked) subjectIcons.push("⭐");
if (pelis.checked) subjectIcons.push("🎬");
if (bolsillo.checked) subjectIcons.push("💰");
if (psico.checked) subjectIcons.push("🧠");

if (subjectIcons.length === 0) {
  subjectIcons.push("📝");
}

const subject =
  subjectIcons.join("") + " " + message.substring(0, 120);

  try {
const formData = new FormData();

formData.append("_subject", subject);
formData.append("message", formattedMessage);

// opcional (recomendado)
formData.append("_captcha", "false");
formData.append("_template", "box");

const response = await fetch("https://formsubmit.co/8f75a7c7a58d3a8b305f5f132f29c79e", {
  method: "POST",
  body: formData
});

const texto = await response.text();

console.log("Estado HTTP:", response.status);
console.log("Respuesta completa:");
console.log(texto);

if (!response.ok) {
  throw new Error("Error en envío");
}

    form.reset();

    button.textContent = "ENVIADO";
    button.classList.add("btn-enviado");


    showConfirmation();

    setTimeout(() => {
      button.textContent = originalButtonText;
      button.classList.remove("btn-enviado");
      button.disabled = false;
      isSending = false;
    }, 2000);

  } catch (error) {
    console.error("ERROR:", error);
    alert("Error al enviar ❌");

    button.disabled = false;
    button.textContent = originalButtonText;
    isSending = false;
  }
});

function showConfirmation() {

  const anterior = button.parentElement.querySelector(".ok-anim");
  if (anterior) anterior.remove();

  const cont = document.createElement("div");
  cont.className = "ok-anim";

  cont.style.position = "relative";
  cont.style.width = "100%";
  cont.style.height = "130px";
  cont.style.display = "flex";
  cont.style.justifyContent = "center";
  cont.style.alignItems = "flex-start";
  cont.style.pointerEvents = "none";
  cont.style.marginTop = "37px";
  cont.style.transform = "translateY(3px)";
  cont.style.zIndex = "9999";


  const ok = document.createElement("div");

  ok.textContent = "OK";

  ok.style.color = "#FFFF00";
  ok.style.fontSize = "120px";
  ok.style.fontWeight = "bold";
  ok.style.lineHeight = "1";
  ok.style.opacity = "0";
  ok.style.transform = "scale(0.65)";
  ok.style.position = "relative";
  ok.style.zIndex = "9999";
  ok.style.textShadow = "0 0 1px #FFFF00";
  ok.style.transition = "opacity .25s ease, transform 1s ease";


  const line = document.createElement("div");

  line.style.position = "absolute";
  line.style.top = "70px";
  line.style.width = "90vw";
  line.style.height = "2px";
  line.style.background = "#FFFF00";
  line.style.opacity = "0";
  line.style.transition = "opacity .1s ease";


  cont.appendChild(ok);
  cont.appendChild(line);

  button.insertAdjacentElement("afterend", cont);


  requestAnimationFrame(() => {

  // aparece pequeño
  ok.style.opacity = "1";

  // fuerza al navegador móvil a pintar el estado inicial
  void ok.offsetWidth;

  setTimeout(() => {

    // crece
    ok.style.transform = "scale(1.5)";

  }, 120);


  setTimeout(() => {

    // vuelve suavemente al tamaño normal
    ok.style.transform = "scale(1)";

  }, 950);


    // desaparece OK
    setTimeout(() => {

      ok.style.opacity = "0";

    }, 1750);


// primera línea
setTimeout(() => {

  line.style.opacity = "1";

}, 2200);


setTimeout(() => {

  line.style.opacity = "0";

}, 2030);


// segunda línea
setTimeout(() => {

  line.style.opacity = "1";

}, 2460);


setTimeout(() => {

  line.style.opacity = "0";

}, 2590);


    setTimeout(() => {

      cont.remove();

    }, 2800);

  });

}



</script>

</body>
</html>
