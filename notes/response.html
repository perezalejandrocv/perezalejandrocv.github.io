<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM RESPONSE</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

background:#000;

color:#00ff66;

font-family:"Courier New", monospace;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}


body::after{

content:"";

position:fixed;

inset:0;

background:
repeating-linear-gradient(
transparent,
transparent 3px,
rgba(0,255,100,.05) 4px
);

pointer-events:none;

}



/* pantalla */

.system{

width:90%;
max-width:600px;

text-align:center;

transition:opacity .5s ease;

}



.message{

font-size:18px;

letter-spacing:3px;

line-height:1.8;

text-shadow:
0 0 10px #00ff66;

margin-bottom:60px;

}



/* botones */

.options{

display:flex;

justify-content:center;

gap:50px;

}


.option{

color:#00ff66;

border:1px solid #00ff66;

padding:12px 25px;

font-size:18px;

cursor:pointer;

box-shadow:
0 0 10px rgba(0,255,100,.5);

animation:optionBlink 1.2s infinite;

}



.option:hover{

background:#00ff66;

color:#000;

}



@keyframes optionBlink{

0%,100%{

opacity:1;

}

50%{

opacity:.25;

}

}



/* linea sistema */

.system-line{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:70%;
    height:3px;

    background:#00ff66;

    opacity:0;

    box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;

    transition:
    width 250ms ease-out,
    height 250ms ease-out;

}


</style>

</head>


<body>


<div class="system">


<div class="message" id="message"></div>



<div class="options">


<div class="option" id="yes">

SÍ

</div>


<div class="option" id="close">

CERRAR SESIÓN

</div>


</div>


</div>



<div class="system-line" id="line"></div>



<script src="system.js"></script>


<script>

const message = document.getElementById("message");

const yes = document.getElementById("yes");

const close = document.getElementById("close");


function typeResponse(){

    const text = "¿DESEAS ENVIAR\nOTRO MENSAJE?";

    let index = 0;

    function writeCharacter(){

        if(index < text.length){

            const char = text[index];

            if(char === "\n"){

                message.innerHTML += "<br>";

            }else{

                message.innerHTML += char;

            }

            index++;

            setTimeout(writeCharacter, 60);

        }

    }

    writeCharacter();

}



typeResponse();


yes.addEventListener("click",()=>{

    systemTransition("notes.html");

});


close.addEventListener("click",()=>{

    systemTransition("end.html");

});

</script>



</body>

</html>
