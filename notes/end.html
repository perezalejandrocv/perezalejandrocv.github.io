<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM END</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

background:#000;

color:#00ff66;

font-family:"Courier New", monospace;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}


body::after{

content:"";

position:fixed;

inset:0;

background:
repeating-linear-gradient(
transparent,
transparent 3px,
rgba(0,255,100,.05) 4px
);

pointer-events:none;

}


/* contenido */

.system{

text-align:center;

}


.message{

font-size:18px;

letter-spacing:3px;

opacity:0;

text-shadow:
0 0 10px #00ff66,
0 0 20px #00ff66;

transition:opacity .2s ease;

}


/* línea sistema */

.system-line{

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%)
scaleX(.2);

width:70%;

height:3px;

background:#00ff66;

opacity:0;

box-shadow:
0 0 10px #00ff66,
0 0 25px #00ff66;

transition:
transform 180ms ease-out,
opacity 180ms ease-out;

}


/* cursor */

.terminal-cursor{

display:inline-block;

width:.65em;
height:1em;

margin-left:3px;

background:#00ff66;

vertical-align:-0.08em;

box-shadow:
0 0 6px #00ff66,
0 0 12px #00ff66;

animation:terminalCursorBlink 0.8s steps(1) infinite;

}


@keyframes terminalCursorBlink{

0%,49%{
    opacity:1;
}

50%,100%{
    opacity:0;
}

}

</style>

</head>


<body>


<div class="system">

<div class="message" id="message">
GRACIAS
</div>

</div>


<div class="system-line" id="line"></div>



<script>

const redirectionSound = new Audio("redirection.mp3");

const message = document.getElementById("message");

const line = document.getElementById("line");


/* 1. APARECE GRACIAS */

setTimeout(() => {

    message.style.opacity = "1";

}, 250);


/* 2. DESAPARECE GRACIAS */

setTimeout(() => {

    message.style.opacity = "0";

}, 900);


/* 3. APARECE LA LÍNEA */

setTimeout(() => {

    line.style.opacity = "1";

    line.style.transform =
        "translate(-50%,-50%) scaleX(1.15)";

}, 1100);


/* 4. DESAPARECE LA LÍNEA */

setTimeout(() => {

    line.style.opacity = "0";

    line.style.transform =
        "translate(-50%,-50%) scaleX(.2)";

}, 1300);


/* 5. APARECE FIN DE LA TRANSMISIÓN */

setTimeout(() => {

    message.textContent = "FIN DE LA TRANSMISIÓN";

    message.style.opacity = "1";

}, 1550);


/* 6. VOLVER AL INDEX */

setTimeout(() => {

    redirectionSound.currentTime = 0;

    redirectionSound.play()
        .then(() => {

            setTimeout(() => {

                window.location.href = "index.html";

            }, 1200);

        })
        .catch(() => {

            window.location.href = "index.html";

        });

}, 2500);


</script>


</body>

</html>
