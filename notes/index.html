<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOTES SYSTEM</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    height:100vh;

    background:#000;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

}


/* ligera pantalla CRT */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:
    repeating-linear-gradient(
        transparent,
        transparent 3px,
        rgba(0,255,100,.06) 4px
    );

    pointer-events:none;

}


/* contenedor */

.system{

    text-align:center;

    /* subir todo el contenido */

    transform:translateY(-60px);

}


/* círculo */

.core{
    width:235px;
    height:235px;

    border-radius:50%;

    border:3px solid #00ff66;

    display:flex;

    justify-content:center;
    align-items:center;

    margin:auto;

    box-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    inset 0 0 30px #00ff66;

    animation:pulse 3s infinite;
}


/* letra N */

.n{
    font-size:162px;

    font-weight:bold;

    color:#00ff66;

    text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;

    cursor:pointer;

    animation:
    rotate 8s linear infinite;
}


/* textos */

.title{

    margin-top:45px;

    font-size:25px;

    letter-spacing:5px;

}


.question{

    margin-top:35px;

    font-size:18px;

    letter-spacing:3px;

}


/* cursor único */

.terminal-cursor{

    display:inline-block;

    width:.65em;
    height:1em;

    margin-left:3px;

    background:#00ff66;

    vertical-align:-0.08em;

    box-shadow:
    0 0 6px #00ff66,
    0 0 12px #00ff66;

    animation:terminalCursorBlink 0.8s steps(1) infinite;

}


@keyframes terminalCursorBlink{

    0%,49%{
        opacity:1;
    }

    50%,100%{
        opacity:0;
    }

}


/* línea sistema */

.system-line{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:70%;
    height:3px;

    background:#00ff66;

    opacity:0;

    box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;

    transition:
    width 250ms ease-out,
    height 250ms ease-out;

}


/* animaciones */

@keyframes rotate{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(360deg);
    }

}


@keyframes pulse{

    0%,100%{

        box-shadow:
        0 0 10px #00ff66,
        0 0 30px #00ff66,
        inset 0 0 30px #00ff66;

    }


    50%{

        box-shadow:
        0 0 20px #00ff66,
        0 0 60px #00ff66,
        inset 0 0 50px #00ff66;

    }

}


</style>

</head>


<body>


<div class="system">

    <div class="core">

        <div class="n" id="enter">
            N
        </div>

    </div>


    <div class="title" id="title"></div>


    <div class="question" id="question"></div>

</div>


<div class="system-line" id="line"></div>


<script src="system.js"></script>

<script>

const enter = document.getElementById("enter");

const title = document.getElementById("title");

const question = document.getElementById("question");


/*
    CURSOR ÚNICO

    El mismo cursor acompaña primero
    a BIENVENIDO y después a la pregunta.
*/

const cursor = document.createElement("span");

cursor.className = "terminal-cursor";


function typeText(element, text, speed, callback){

    let index = 0;

    element.innerHTML = "";

    element.appendChild(cursor);


    function writeCharacter(){

        if(index < text.length){

            /*
                Quitamos temporalmente el cursor,
                escribimos el carácter y lo volvemos
                a colocar al final.
            */

            cursor.remove();

            element.textContent += text[index];

            element.appendChild(cursor);

            index++;

            setTimeout(writeCharacter, speed);

        }else{

            if(callback){
                callback();
            }

        }

    }


    writeCharacter();

}


/* primero BIENVENIDO */

typeText(
    title,
    "BIENVENIDO",
    50,
    () => {

        setTimeout(() => {

            /*
                El MISMO cursor pasa
                a la segunda frase.
            */

            cursor.remove();

            typeText(
                question,
                "¿QUIERES ENVIAR UN MENSAJE?",
                50
            );

        }, 300);

    }
);


/* entrar */

enter.addEventListener("click", () => {

    systemTransition("notes.html");

});

</script>


</body>

</html>
