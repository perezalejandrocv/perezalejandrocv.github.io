<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOTES TERMINAL</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

background:#000;

color:#00ff66;

font-family:"Courier New", monospace;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}


body::after{

content:"";

position:fixed;

inset:0;

background:
repeating-linear-gradient(
transparent,
transparent 3px,
rgba(0,255,100,.05) 4px
);

pointer-events:none;

}


/* terminal */

.system{

width:94%;
max-width:760px;

text-align:center;

transition:opacity .5s ease;

}


/* SYSTEM READY */

.status{

position:absolute;

left:0;
top:50%;

width:100%;

transform:translateY(-50%);

font-size:18px;

letter-spacing:4px;

text-align:center;

text-shadow:
0 0 10px #00ff66;

pointer-events:none;

z-index:2;

}


.status.intro-glow{

text-shadow:
0 0 5px #00ff66,
0 0 15px #00ff66,
0 0 30px #00ff66;

}


/* textarea */

.textarea-wrapper{
    position:relative;
    width:100%;
    transform:translateY(-20px);
}


textarea{

width:100%;

height:68vh;
min-height:420px;
max-height:700px;

resize:none;

background:#000;

border:none;
outline:none;

overflow:hidden;

color:#00ff66;

font-family:"Courier New", monospace;

font-size:18px;

line-height:1.5;

padding:18px;

caret-color:transparent;

}


textarea:disabled{

opacity:1;

}


/* cursor cuadrado */


.textarea-cursor{

position:absolute;

width:.65em;
height:1em;

background:#00ff66;

box-shadow:
0 0 6px #00ff66,
0 0 12px #00ff66;

pointer-events:none;

visibility:hidden;

}

.textarea-cursor.visible{

visibility:visible;

animation:terminalCursorBlink .8s steps(1) infinite;

}



@keyframes terminalCursorBlink{

0%,49%{
opacity:1;
}

50%,100%{
opacity:0;
}

}


/* opciones */

.options{
    margin-top:-25px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}


.option{

border:1px solid #00ff66;

padding:8px 12px;

cursor:pointer;

font-size:14px;

transition:.2s;

}


.option.active{

background:#00ff66;

color:#000;

box-shadow:
0 0 15px #00ff66;

}


/* botón */

button{

margin-top:22px;

background:#000;

border:1px solid #00ff66;

color:#00ff66;

padding:12px 45px;

font-family:inherit;

font-size:18px;

cursor:pointer;

box-shadow:
0 0 10px rgba(0,255,100,.5);

animation:optionBlink 1.2s infinite;

}


button:hover{

background:#00ff66;

color:#000;

}

@keyframes optionBlink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.25;
    }

}


/* línea de sistema */

.system-line{

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%)
scaleX(1);

width:120%;

height:2px;

background:#00ff66;

opacity:0;

box-shadow:
0 0 10px #00ff66,
0 0 25px #00ff66;

transition:
transform 180ms ease-out,
opacity 180ms ease-out;

pointer-events:none;

}


/* efecto inicial de la línea */




.status-text{
    transition:opacity 150ms ease;
}


.intro-line{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%)
scaleX(.2);

width:70%;
height:2px;

background:#00ff66;

opacity:0;

box-shadow:
0 0 10px #00ff66,
0 0 25px #00ff66;

transition:
transform 180ms ease-out,
opacity 180ms ease-out;

pointer-events:none;

}


.entry-line{

position:absolute;

left:50%;

height:2px;

width:70%;

background:#00ff66;

opacity:0;

box-shadow:
0 0 10px #00ff66,
0 0 25px #00ff66;

transform:
translate(-50%,-50%)
scaleX(.2);

transition:
transform 180ms ease-out,
opacity 180ms ease-out;

pointer-events:none;

z-index:3;

}



</style>

</head>


<body>


<div class="system">


<form id="form">

<div class="textarea-wrapper">

<textarea
name="message"
required></textarea>

<span class="textarea-cursor"></span>

<div class="status" id="status">

<span id="status-text" class="status-text"></span>

<div class="intro-line" id="introLine"></div>

</div>

<div class="entry-line" id="entryLine"></div>

</div>


<div class="options">


<div class="option" data-value="URGENTE">
URGENTE
</div>


<div class="option" data-value="HOTEL">
HOTEL
</div>


<div class="option" data-value="PELIS">
PELIS
</div>


<div class="option" data-value="BOLSILLO">
BOLSILLO
</div>


<div class="option" data-value="PSICO">
PSICO
</div>

<div class="option" data-value="ENGLISH">
    ENGLISH
</div>



</div>


<button type="submit">
SEND
</button>


</form>


</div>

<div class="system-line" id="line"></div>


<script src="system.js"></script>


<script>


const form = document.getElementById("form");

const textarea = form.querySelector("textarea");

const status = document.getElementById("status");

const statusText = document.getElementById("status-text");

const line = document.getElementById("line");

const introLine = document.getElementById("introLine");

const cursor = document.querySelector(".textarea-cursor");

const entryLine = document.getElementById("entryLine");

const MAX_LINES = 20;


function updateCursor(){

    const style = getComputedStyle(textarea);

    const text = textarea.value;

    const lines = text.split("\n");

    const currentLine = lines[lines.length - 1];

    const canvas = document.createElement("canvas");

    const ctx = canvas.getContext("2d");

    ctx.font =
        style.fontSize + " " +
        style.fontFamily;

    const textWidth = ctx.measureText(currentLine).width;

    const paddingLeft = parseFloat(style.paddingLeft);
    const paddingTop = parseFloat(style.paddingTop);

    const lineHeight = parseFloat(style.lineHeight);

    const lineNumber = lines.length - 1;


    cursor.style.left =
        (paddingLeft + textWidth) + "px";

    cursor.style.top =
        (paddingTop + lineNumber * lineHeight - textarea.scrollTop + 3) + "px";


}


textarea.addEventListener("input", updateCursor);

textarea.addEventListener("click", updateCursor);

textarea.addEventListener("keyup", updateCursor);

textarea.addEventListener("scroll", updateCursor);

const lineSound = new Audio("sound.mp3");


/* efecto de línea al pulsar ENTER */

textarea.addEventListener("keydown", (e) => {

    if(e.key !== "Enter") return;

    const lines = textarea.value.split("\n");

    if(lines.length >= MAX_LINES){

        e.preventDefault();

        return;

    }

    e.preventDefault();

    lineSound.currentTime = 0;

    lineSound.play().catch(() => {});


    const style = getComputedStyle(textarea);

    const paddingTop =
        parseFloat(style.paddingTop);

    const lineHeight =
        parseFloat(style.lineHeight);

    const currentLine =
        lines.length - 1;

    const lineY =
        paddingTop +
        currentLine * lineHeight +
        lineHeight / 2;


    /* insertar el salto de línea */

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    textarea.setRangeText(
        "\n",
        start,
        end,
        "end"
    );


    /* posición visual de la línea */

    entryLine.style.top =
        lineY + "px";


    /* estado inicial */

    entryLine.style.opacity = "0";

    entryLine.style.transform =
        "translate(-50%,-50%) scaleX(.2)";


    /* aparición */

    setTimeout(() => {

        entryLine.style.opacity = "1";

        entryLine.style.transform =
            "translate(-50%,-50%) scaleX(1.15)";

    }, 100);


    /* desaparición */

    setTimeout(() => {

        entryLine.style.opacity = "0";

        entryLine.style.transform =
            "translate(-50%,-50%) scaleX(.2)";

    }, 280);


    updateCursor();

});


let selected = [];


/* opciones */

document.querySelectorAll(".option")
.forEach(option => {

option.onclick = () => {

option.classList.toggle("active");

const value = option.dataset.value;


if(selected.includes(value)){

selected = selected.filter(x => x !== value);

}else{

selected.push(value);

}

};

});


/* textarea bloqueado durante la secuencia */

textarea.disabled = true;


/* escritura progresiva */

function typeSystemReady(){

    const text = "SYSTEM READY";

    let i = 0;

    const typing = setInterval(() => {

        statusText.textContent += text[i];

        i++;

        if(i >= text.length){

            clearInterval(typing);

            // Pequeña pausa antes del brillo
            setTimeout(() => {

                status.classList.add("intro-glow");

                // Brillo
                setTimeout(() => {

                    status.classList.remove("intro-glow");

                    // SYSTEM READY permanece visible
                    statusText.style.opacity = "1";

                    // Breve pausa antes de desaparecer
                    setTimeout(() => {

                        statusText.style.opacity = "0";

                        // Esperamos un poco y aparece la línea
                        setTimeout(() => {

                            playNotesLine();

                        }, 150);

                    }, 300);

                }, 400);

            }, 100);

        }

    }, 60);

}


/* línea sobre SYSTEM READY */

function playNotesLine(){

introLine.style.opacity = "0";

introLine.style.transform =
"translate(-50%,-50%) scaleX(.2)";


setTimeout(() => {

introLine.style.opacity = "1";

introLine.style.transform =
"translate(-50%,-50%) scaleX(1.15)";

},100);


setTimeout(() => {

introLine.style.opacity = "0";

introLine.style.transform =
"translate(-50%,-50%) scaleX(.2)";

},280);


setTimeout(() => {

    textarea.disabled = false;

    textarea.focus();

    updateCursor();

    cursor.classList.add("visible");

},550);

}



/* iniciar */

typeSystemReady();


/* envío */

/* envío */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const message = textarea.value.trim();


    /* FECHA Y HORA */

    const now = new Date();

    const time =
        String(now.getDate()).padStart(2, "0") + "/" +
        String(now.getMonth() + 1).padStart(2, "0") + "/" +
        String(now.getFullYear()).slice(-2) + " " +
        String(now.getHours()).padStart(2, "0") + ":" +
        String(now.getMinutes()).padStart(2, "0");


    /* FORMULARIO */

    const formData = new FormData();


    /* ICONOS DEL ASUNTO */

    const subjectIcons = selected.map(value => {

        const icons = {

            URGENTE: "🚨",
            HOTEL: "⭐",
            PELIS: "🎬",
            BOLSILLO: "💰",
            PSICO: "🧠",
            ENGLISH: "🇬🇧"

        };

        return icons[value];

    });


    if(subjectIcons.length === 0){

        subjectIcons.push("📝");

    }


    const subject =
        subjectIcons.join("") +
        " " +
        message.substring(0, 120);


    /* ETIQUETAS DEL MENSAJE */

    const labelIcons = {

        URGENTE: "🚨 URGENTE",
        HOTEL: "⭐ HOTEL",
        PELIS: "🎬 PELIS",
        BOLSILLO: "💰 BOLSILLO",
        PSICO: "🧠 PSICO",
        ENGLISH: "🇬🇧 ENGLISH"

    };


    const etiquetas = selected.map(
        value => labelIcons[value]
    );


    /* MENSAJE FINAL */

    const formattedMessage =

        "📒 N O T E S\n" +
        "🧑 Alejandro Pérez\n" +
        "🕒 " + time + "\n" +

        (
            etiquetas.length
            ? etiquetas.join(" · ")
            : "📝 MENSAJE"
        ) +

        "\n\n" +

        "───────────────────────────────────────────────────────────────────────────────────\n\n" +

        message;


    /* DATOS PARA FORMSUBMIT */

    formData.append(
        "_subject",
        subject
    );


    formData.append(
        "message",
        formattedMessage
    );


    formData.append(
        "_captcha",
        "false"
    );


    formData.append(
        "_template",
        "box"
    );


    /* ENVÍO */

    try{

        const response = await fetch(

            "https://formsubmit.co/canalsjaume@yahoo.com",

            {

                method: "POST",

                body: formData

            }

        );


        if(!response.ok){

            throw new Error("Error en envío");

        }


        systemTransition("response.html");


    }catch(e){

        console.error(e);

        alert("SYSTEM ERROR");

    }

});



</script>


</body>

</html>
