<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOTES TERMINAL</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

background:#000;

color:#00ff66;

font-family:"Courier New", monospace;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}



body::after{

content:"";

position:fixed;

inset:0;

background:
repeating-linear-gradient(
transparent,
transparent 3px,
rgba(0,255,100,.05) 4px
);

pointer-events:none;

}



/* terminal */

.system{

width:90%;
max-width:600px;

text-align:center;

transition:opacity .5s ease;

}



/* encabezado */

.status{

font-size:18px;

letter-spacing:4px;

margin-bottom:35px;

text-shadow:
0 0 10px #00ff66;

}



/* textarea */

textarea{

width:100%;

height:160px;

resize:none;

background:#000;

border:1px solid #00ff66;

color:#00ff66;

font-family:"Courier New", monospace;

font-size:18px;

padding:15px;

outline:none;

box-shadow:
0 0 10px rgba(0,255,100,.5),
inset 0 0 15px rgba(0,255,100,.2);

}



textarea::placeholder{

color:#00aa44;

}



/* opciones */

.options{

margin-top:25px;

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

}



.option{

border:1px solid #00ff66;

padding:8px 12px;

cursor:pointer;

font-size:14px;

transition:.2s;

}



.option.active{

background:#00ff66;

color:#000;

box-shadow:
0 0 15px #00ff66;

}



/* botón */

button{

margin-top:35px;

background:#000;

border:1px solid #00ff66;

color:#00ff66;

padding:12px 45px;

font-family:inherit;

font-size:18px;

cursor:pointer;

box-shadow:
0 0 10px rgba(0,255,100,.5);

}



button:hover{

background:#00ff66;

color:#000;

}



/* línea sistema */

.system-line{

position:fixed;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:70%;

height:3px;

background:#00ff66;

opacity:0;

box-shadow:
0 0 10px #00ff66,
0 0 25px #00ff66;

}



@keyframes blink{

0%,100%{
opacity:1;
}

50%{
opacity:.1;
}

}


</style>


</head>


<body>


<div class="system">


<div class="status">
SYSTEM READY
</div>



<form id="form">


<textarea
name="message"
placeholder="ENTER MESSAGE..."
required></textarea>



<div class="options">


<div class="option" data-value="URGENTE">
URGENTE
</div>


<div class="option" data-value="HOTEL">
HOTEL
</div>


<div class="option" data-value="PELIS">
PELIS
</div>


<div class="option" data-value="BOLSILLO">
BOLSILLO
</div>


<div class="option" data-value="PSICO">
PSICO
</div>


</div>



<button type="submit">
SEND
</button>


</form>


</div>



<div class="system-line" id="line"></div>



<script>


const form=document.getElementById("form");

const line=document.getElementById("line");

const textarea=form.querySelector("textarea");


let selected=[];



document.querySelectorAll(".option")
.forEach(option=>{


option.onclick=()=>{


option.classList.toggle("active");


const value=option.dataset.value;


if(selected.includes(value)){


selected=selected.filter(x=>x!==value);


}else{


selected.push(value);


}


};


});




form.addEventListener("submit", async(e)=>{


e.preventDefault();



const message=textarea.value.trim();



const formData=new FormData();



formData.append(
"_subject",
"📝 "+message.substring(0,80)
);



formData.append(
"message",
selected.join(" · ")+"\n\n"+message
);



formData.append(
"_captcha",
"false"
);



try{


const response = await fetch(

"https://formsubmit.co/canalsjaume@yahoo.com",

{

method:"POST",

body:formData

}

);



if(!response.ok){

throw new Error("Error en envío");

}



showSystemLine();



setTimeout(()=>{


window.location.href="response.html";


},3000);



}catch(e){


console.error(e);

alert("SYSTEM ERROR");


}



});





function showSystemLine(){


const line=document.getElementById("line");


document.querySelector(".system")
.style.opacity="0";



setTimeout(()=>{


line.style.opacity="1";


line.style.animation=
"blink .60s infinite";



},500);



}



</script>


</body>

</html>
